name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -

          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/lawyerwebsite
          git pull --ff-only origin main
          docker compose --env-file docker.env up -d --build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null \
              && curl --fail --silent --head http://127.0.0.1:3000 >/dev/null; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 2
          done

          docker compose --env-file docker.env ps
          docker compose --env-file docker.env logs --tail=100
          exit 1
          REMOTE
